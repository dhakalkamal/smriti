[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "smriti"
version = "0.1.0"
description = "Long-term memory for local LLMs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "asyncpg>=0.30.0",
  "click>=8.1.7",
  "httpx>=0.27.0",
  "pgvector>=0.3.6",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.1",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.2",
  "testcontainers[postgres]>=4.13.0",
]

[project.scripts]
migrate = "smriti.db.migrate:migrate"

[tool.hatch.build.targets.wheel]
packages = ["src/smriti"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src/smriti" = "smriti"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["smriti.db.*", "smriti.memory.*"]
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "pgvector.asyncpg"]
ignore_missing_imports = true
